name: Aegis Windows checks
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Prepare project environment
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Build and test Windows x64 native engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          cmake -S src/Aegis.Native -B artifacts/native-build -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build artifacts/native-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir artifacts/native-build -C Release --output-on-failure --output-junit "$pwd/TestResults/native.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/Aegis.NativeHost/Aegis.NativeHost.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item artifacts/native-build/Release/aegis_native.dll src/Aegis.NativeHost/bin/Release/net10.0/aegis_native.dll
      - name: Run the local verification suite
        if: always()
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Exercise actual native Gateway pipe and recovery checks
        shell: pwsh
        run: |
          $env:AEGIS_TEST_NATIVE_HOST_EXE = (Resolve-Path src/Aegis.NativeHost/bin/Release/net10.0/Aegis.NativeHost.exe).Path
          dotnet run --project tests/Aegis.Gateway.Tests/Aegis.Gateway.Tests.csproj -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Aegis.Gateway.Tests/Aegis.Gateway.Tests.csproj -c Release --no-build --no-restore -- --native-fault-timing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-check-evidence
          path: |
            TestResults/
            artifacts/checks/
          if-no-files-found: warn
